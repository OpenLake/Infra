version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: openlake
      POSTGRES_PASSWORD: openlake_dev
      POSTGRES_DB: openlake

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - backend

volumes:
  postgres-data:

networks:
  backend:
    name: openlake-backend
    external: true
